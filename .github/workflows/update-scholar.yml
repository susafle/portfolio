name: Update Google Scholar metrics

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Fetch Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional; makes it reliable
        run: python scripts/update_scholar.py

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add scholar-metrics.json docs/scholar-metrics.json
          if git diff --staged --quiet; then
            echo "No metric changes."
          else
            git commit -m "chore: update Google Scholar metrics"
            git push
          fi
